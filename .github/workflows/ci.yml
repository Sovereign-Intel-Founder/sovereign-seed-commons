name: Commons CI

on:
  push:
    branches: [ main, feat/commons-contributor-workflow ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    - name: Run Adapter Tests
      run: python3 test_adapters.py
    - name: Run Loader Tests
      run: python3 test_loader.py
    - name: Run Security Tests
      run: python3 test_security.py
