name: Sovereign Attestation CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Generate Dummy Ledger if Missing
        run: touch revenue_vault.db
      - name: Run Attestation Hook
        run: bash tools/attestation/cell_hook.sh
      - name: Verify Cryptographic Proof
        run: python3 tools/attestation/verify_proof.py
